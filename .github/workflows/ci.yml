name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rules-and-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install semgrep
        run: pip install semgrep

      - name: Validate rules
        run: semgrep --validate --config rules/sql-injection.yaml

      - name: Scan samples
        run: semgrep --config rules/sql-injection.yaml samples/ --json --output semgrep.json

      - name: Build contexts
        run: python core/context_extractor.py --semgrep-json semgrep.json --format json > contexts.json

      - name: Check finding count
        run: |
          python - <<'PY'
          import json
          data = json.load(open("semgrep.json", encoding="utf-8"))
          contexts = json.load(open("contexts.json", encoding="utf-8"))
          assert len(data["results"]) == 6, len(data["results"])
          assert len(contexts) == 6, len(contexts)
          assert all(c["function"] for c in contexts)
          print("findings:", len(data["results"]), "contexts:", len(contexts))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: contexts
          path: contexts.json
